{% extends "base.html" %}{% load lumen %}
{% block title %}Add event · {{ lumen_site.site_name }}{% endblock %}
{% block content %}
<div class="page-header"><div><h1>Add event</h1><p class="sub"><a href="{% url 'schedule:calendar' %}">← Calendar</a></p></div></div>
<form method="post" class="card mw-640" novalidate>{% csrf_token %}
{% for field in form %}{% include "partials/field.html" %}{% endfor %}
<div class="mt-4"><button class="btn" type="submit">Add event</button></div></form>
{% endblock %}
